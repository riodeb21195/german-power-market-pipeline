[project]
name = "power-market"
version = "0.1.0"
description = "Daily batch pipeline for German power market and weather data"
readme = "README.md"
authors = [
    { name = "jd21195", email = "josef.deb95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "sqlfluff>=4.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF", "ANN", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=power_market --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: needs Docker (testcontainers)"]

[tool.coverage.run]
branch = true
source = ["power_market"]
